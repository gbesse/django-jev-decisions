# Purpose: Exercise Django checks, migrations and integration tests without building a distribution.
name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m django check
      - run: python -m django test tests
      - run: python -m django makemigrations jev_decisions --check --dry-run
      - run: python -m examples.offline_demo
